server {
  listen       80;
  server_name  _;
  root   /usr/share/nginx/html;
  index  index.html;

  # Security headers. No CSP 'unsafe-eval'; the app is a static bundle. Google Fonts is the
  # only external origin (with a system-font fallback if it is blocked).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; base-uri 'self'; form-action 'self'" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;

  # Hashed build assets are immutable → cache hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Baseline catalog CSVs: let updated images push new defaults without stale caching.
  location /data/ {
    add_header Cache-Control "no-cache";
  }

  # index.html must never be cached so new deploys are picked up immediately.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Single-page app: fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
